[[mods]]
modId="dsneckfix_pdc"
version="1.4.0"
displayName="DS Neck Fix - PaperDoll Compat"
authors="Hz, Deepseek"
logoFile="icon.png"
description='''
Rendering compatibility between DragonSurvival and paper doll mods
(tr7zw PaperDoll, Fuzss PaperDoll and Yes Steve Model). Fixes the
dragon neck/head and glide pose in paper doll previews, stabilises YSM
GUI previews, and adds a client-side DragonSurvival / Yes Steve Model
render priority switch for the local player and other players. 
'''

[[mixins]]
config = "dsneckfix_pdc.mixins.json"

[[dependencies.dsneckfix_pdc]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.190,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.dsneckfix_pdc]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1]"
    ordering="NONE"
    side="CLIENT"

[[dependencies.dsneckfix_pdc]]
    modId="dragonsurvival"
    type="required"
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.dsneckfix_pdc]]
    modId="geckolib"
    type="required"
    versionRange="[4.6,)"
