[[mods]]
modId="dsneckfix_pdc"
version="1.0.0"
displayName="DS Neck Fix - PaperDoll Compat"
authors="Hz, Deepseek"
logoFile="icon.png"
description='''Fixes rendering compatibility between DragonSurvival and PaperDoll. Renders the player as their dragon in the paper doll — showing the neck/head and facing the body forward, following the player's head pitch, and swaying (dive pitch + tail) while gliding like the third-person dragon. Configurable: glide sway on/off, and keep the paper doll always shown instead of auto-hiding.'''

[[mixins]]
config = "dsneckfix_pdc.mixins.json"

